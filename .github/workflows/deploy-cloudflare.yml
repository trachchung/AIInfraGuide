name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          SITE_URL: https://infra-guide.polyserver.xyz
          BASE_PATH: /
        run: npm run build

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Account ID length: ${#CLOUDFLARE_ACCOUNT_ID}"
          echo "Account ID prefix: ${CLOUDFLARE_ACCOUNT_ID:0:4}…"
          curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            https://api.cloudflare.com/client/v4/user/tokens/verify \
            | tee /tmp/cf-verify.json
          echo
          code=$(curl -sS -o /tmp/cf-projects.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects")
          echo "List Pages projects HTTP ${code}"
          python3 - <<'PY'
          import json
          v=json.load(open("/tmp/cf-verify.json"))
          print("token.verify success=", v.get("success"), "errors=", v.get("errors"), "status=", (v.get("result") or {}).get("status"))
          p=json.load(open("/tmp/cf-projects.json"))
          print("pages.projects success=", p.get("success"), "errors=", p.get("errors"))
          if p.get("result"):
            print("existing projects:", [x.get("name") for x in p["result"]])
          PY
          test "$code" = "200"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npm i -g wrangler@4
          # Create once; ignore "already exists" on later runs.
          wrangler pages project create infra-guide --production-branch=main \
            || true
          wrangler pages deploy dist \
            --project-name=infra-guide \
            --branch=main \
            --commit-dirty=true

      - name: Attach custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DOMAIN: infra-guide.polyserver.xyz
          PROJECT: infra-guide
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/cf-domain.json -w '%{http_code}' \
            -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"name\":\"${DOMAIN}\"}")
          echo "HTTP ${code}"
          cat /tmp/cf-domain.json
          echo
          case "$code" in
            200|201|409) ;;
            *) exit 1 ;;
          esac
          curl -sS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/${PROJECT}/domains" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print([(x.get('name'), x.get('status')) for x in d.get('result',[])])"
